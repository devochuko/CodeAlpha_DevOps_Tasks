name: Java Gradle CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Build with Gradle and Run Tests
      working-directory: ./Task3_Gradle_Java_App
      run: ./gradlew build

    - name: Build Docker Image
      working-directory: ./Task3_Gradle_Java_App
      run: |
        docker build -t codealpha-java-app:latest .
        docker run --rm codealpha-java-app:latest